name: AnixOS CI - Typecheck & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run Build & Typecheck
        run: npm run build
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: https://loqgaepskvqkhmcweszd.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Build Output
        run: |
          if [ -d "dist" ]; then
            echo "Build succeeded: apps/web/dist found."
          else
            echo "Build failed: apps/web/dist missing!"
            exit 1
          fi
        working-directory: apps/web