name: AnixOS CI - Typecheck & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    name: Typecheck & Build (apps/web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
           - name: Install Dependencies (workspace root)
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Typecheck (apps/web)
        run: cd apps/web && npx tsc --noEmit
        env:
          VITE_SUPABASE_URL: https://loqgaepskvqkhmcweszd.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build (apps/web)
        run: cd apps/web && npm run build
        env:
          VITE_SUPABASE_URL: https://loqgaepskvqkhmcweszd.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Build Output
        run: |
          if [ -d "apps/web/dist" ]; then
            echo "✅ Build succeeded: apps/web/dist found."
          else
            echo "❌ Build failed: apps/web/dist missing!"
            exit 1
          fi
