name: AnixOS CI - Typecheck & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    name: Typecheck & Build (apps/web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
        env:
          VITE_SUPABASE_URL: https://loqgaepskvqkhmcweszd.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://loqgaepskvqkhmcweszd.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Build Output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build succeeded: apps/web/dist found."
          else
            echo "❌ Build failed: apps/web/dist missing!"
            exit 1
          fi
