[package]
name = "anixos"
version = "1.0.0"
description = "AniXOS — Industrial Shop Floor Execution & Workshop MES Platform"
authors = ["AniXOS Team"]
edition = "2021"
rust-version = "1.77.2"

# Voir plus d'infos : https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "anixos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Cette fonctionnalité est utilisée pour le mode personnalisé (mobile)
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
